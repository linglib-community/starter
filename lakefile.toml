name = "my_project"
defaultTargets = ["MyProject"]

# linglib is pinned to a release. Releases come with prebuilt files, so linglib is
# downloaded rather than compiled. The Lean version in lean-toolchain must match
# linglib's; change both together (see AGENTS.md, "Updating linglib").
[[require]]
name = "linglib"
git = "https://github.com/linglib-community/linglib"
rev = "v4.34.1"

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "MyProject"
